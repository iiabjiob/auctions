name: auctions-app

services:
  db:
    image: postgres:16
    restart: unless-stopped
    env_file:
      - ./backend/.env.db.prod
    volumes:
      - db_data_prod:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - net

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis_data_prod:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - net

  migrations:
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
    restart: "no"
    env_file:
      - ./backend/.env.prod
      - ./backend/.env.db.prod
    command: ["alembic", "upgrade", "head"]
    depends_on:
      db:
        condition: service_healthy
    networks:
      - net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
    restart: unless-stopped
    env_file:
      - ./backend/.env.prod
      - ./backend/.env.db.prod
    environment:
      ZAKUPKI_FETCH_GATEWAY_URL: http://zakupki-fetcher:8080
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      zakupki-fetcher:
        condition: service_healthy
      migrations:
        condition: service_completed_successfully
    expose:
      - "8000"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health')",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - net

  auction-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
    restart: unless-stopped
    env_file:
      - ./backend/.env.prod
      - ./backend/.env.db.prod
    command: ["python", "-m", "app.worker.auction_sync_worker"]
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrations:
        condition: service_completed_successfully
    networks:
      - net

  auction-analysis-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
    restart: unless-stopped
    env_file:
      - ./backend/.env.prod
      - ./backend/.env.db.prod
    command: ["python", "-m", "app.worker.auction_analysis_worker"]
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrations:
        condition: service_completed_successfully
    networks:
      - net

  auction-actuality-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
    restart: unless-stopped
    env_file:
      - ./backend/.env.prod
      - ./backend/.env.db.prod
    command: ["python", "-m", "app.worker.auction_actuality_worker"]
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrations:
        condition: service_completed_successfully
    networks:
      - net

  auction-enrichment-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
    restart: unless-stopped
    env_file:
      - ./backend/.env.prod
      - ./backend/.env.db.prod
    command: ["python", "-m", "app.worker.auction_enrichment_worker"]
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrations:
        condition: service_completed_successfully
    networks:
      - net

  procurement-sync-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
    restart: unless-stopped
    env_file:
      - ./backend/.env.prod
      - ./backend/.env.db.prod
    environment:
      PROCUREMENT_SYNC_ENABLED: "true"
      PROCUREMENT_SYNC_RUN_ON_START: "true"
      ZAKUPKI_FETCH_GATEWAY_URL: http://zakupki-fetcher:8080
    command: ["python", "-m", "app.worker.procurement_sync_worker"]
    depends_on:
      db:
        condition: service_healthy
      zakupki-fetcher:
        condition: service_healthy
      migrations:
        condition: service_completed_successfully
    networks:
      - net

  telegram-sender-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
    restart: unless-stopped
    env_file:
      - ./backend/.env.prod
      - ./backend/.env.db.prod
    command: ["python", "-m", "app.worker.telegram_sender_worker"]
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrations:
        condition: service_completed_successfully
    networks:
      - net

  zakupki-fetcher:
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
    restart: unless-stopped
    env_file:
      - ./backend/.env.prod
    command:
      [
        "uvicorn",
        "app.zakupki_fetcher:app",
        "--host",
        "0.0.0.0",
        "--port",
        "8080",
        "--proxy-headers",
        "--forwarded-allow-ips=*",
      ]
    ports:
      - "18080:8080"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health')",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - net

  nginx:
    build:
      context: .
      dockerfile: ./frontend/Dockerfile.prod
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "8080:80"
    networks:
      - net

volumes:
  db_data_prod:
  redis_data_prod:

networks:
  net:
