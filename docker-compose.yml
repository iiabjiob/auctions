name: auctions-app

services:
  dev:
    build:
      context: .
      dockerfile: .devcontainer/Dockerfile
      tags:
        - auctions-dev:latest
    container_name: auctions-dev-container
    volumes:
      - .:/workspace
    command: sleep infinity
    networks:
      - net
  db:
    image: postgres:16
    container_name: auctions-db-dev
    restart: unless-stopped
    env_file:
      - ./backend/.env.db.dev
    ports:
      - "5432:5432"
    volumes:
      - db_data_dev:/var/lib/postgresql/data
    networks:
      - net

  redis:
    image: redis:7-alpine
    container_name: auctions-redis-dev
    restart: unless-stopped
    volumes:
      - redis_data_dev:/data
    networks:
      - net

  auction-worker:
    build:
      context: .
      dockerfile: .devcontainer/Dockerfile
      tags:
        - auctions-dev:latest
    container_name: auctions-worker-dev
    working_dir: /workspace/backend
    command: uv run python -m app.worker.auction_sync_worker
    volumes:
      - .:/workspace
    env_file:
      - ./backend/.env.dev
    depends_on:
      - db
      - redis
    networks:
      - net

  auction-analysis-worker:
    build:
      context: .
      dockerfile: .devcontainer/Dockerfile
      tags:
        - auctions-dev:latest
    container_name: auctions-analysis-worker-dev
    working_dir: /workspace/backend
    command: uv run python -m app.worker.auction_analysis_worker
    volumes:
      - .:/workspace
    env_file:
      - ./backend/.env.dev
    depends_on:
      - db
      - redis
    networks:
      - net

  auction-actuality-worker:
    build:
      context: .
      dockerfile: .devcontainer/Dockerfile
      tags:
        - auctions-dev:latest
    container_name: auctions-actuality-worker-dev
    working_dir: /workspace/backend
    command: uv run python -m app.worker.auction_actuality_worker
    volumes:
      - .:/workspace
    env_file:
      - ./backend/.env.dev
    depends_on:
      - db
      - redis
    networks:
      - net

  auction-enrichment-worker:
    build:
      context: .
      dockerfile: .devcontainer/Dockerfile
      tags:
        - auctions-dev:latest
    container_name: auctions-enrichment-worker-dev
    working_dir: /workspace/backend
    command: uv run python -m app.worker.auction_enrichment_worker
    volumes:
      - .:/workspace
    env_file:
      - ./backend/.env.dev
    depends_on:
      - db
      - redis
    networks:
      - net

  procurement-sync-worker:
    build:
      context: .
      dockerfile: .devcontainer/Dockerfile
      tags:
        - auctions-dev:latest
    container_name: auctions-procurement-sync-worker-dev
    working_dir: /workspace/backend
    command: uv run python -m app.worker.procurement_sync_worker
    volumes:
      - .:/workspace
    env_file:
      - ./backend/.env.dev
    environment:
      PROCUREMENT_SYNC_ENABLED: "true"
      PROCUREMENT_SYNC_RUN_ON_START: "true"
      ZAKUPKI_FETCH_GATEWAY_URL: http://zakupki-fetcher:8080
      ZAKUPKI_FETCH_TOKEN: ${ZAKUPKI_FETCH_TOKEN:-dev-zakupki-fetch-token}
    depends_on:
      - db
      - zakupki-fetcher
    networks:
      - net

  procurement-enrichment-worker:
    build:
      context: .
      dockerfile: .devcontainer/Dockerfile
      tags:
        - auctions-dev:latest
    container_name: auctions-procurement-enrichment-worker-dev
    working_dir: /workspace/backend
    command: uv run python -m app.worker.procurement_enrichment_worker
    volumes:
      - .:/workspace
    env_file:
      - ./backend/.env.dev
    environment:
      PROCUREMENT_ENRICHMENT_ENABLED: "true"
      ZAKUPKI_FETCH_GATEWAY_URL: http://zakupki-fetcher:8080
      ZAKUPKI_FETCH_TOKEN: ${ZAKUPKI_FETCH_TOKEN:-dev-zakupki-fetch-token}
    depends_on:
      - db
      - zakupki-fetcher
    networks:
      - net

  procurement-actuality-worker:
    build:
      context: .
      dockerfile: .devcontainer/Dockerfile
      tags:
        - auctions-dev:latest
    container_name: auctions-procurement-actuality-worker-dev
    working_dir: /workspace/backend
    command: uv run python -m app.worker.procurement_actuality_worker
    volumes:
      - .:/workspace
    env_file:
      - ./backend/.env.dev
    environment:
      PROCUREMENT_ACTUALITY_SWEEP_ENABLED: "true"
    depends_on:
      - db
    networks:
      - net

  telegram-sender-worker:
    build:
      context: .
      dockerfile: .devcontainer/Dockerfile
      tags:
        - auctions-dev:latest
    container_name: auctions-telegram-sender-worker-dev
    working_dir: /workspace/backend
    command: uv run python -m app.worker.telegram_sender_worker
    volumes:
      - .:/workspace
    env_file:
      - ./backend/.env.dev
    depends_on:
      - db
      - redis
    networks:
      - net

  zakupki-fetcher:
    build:
      context: .
      dockerfile: .devcontainer/Dockerfile
      tags:
        - auctions-dev:latest
    container_name: auctions-zakupki-fetcher-dev
    working_dir: /workspace/backend
    command: uv run uvicorn app.zakupki_fetcher:app --host 0.0.0.0 --port 8080 --proxy-headers --forwarded-allow-ips=*
    volumes:
      - .:/workspace
    env_file:
      - ./backend/.env.dev
    environment:
      ZAKUPKI_FETCH_TOKEN: ${ZAKUPKI_FETCH_TOKEN:-dev-zakupki-fetch-token}
    ports:
      - "18080:8080"
    networks:
      - net

volumes:
  db_data_dev:
  redis_data_dev:

networks:
  net:
